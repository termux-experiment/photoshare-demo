
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100K Social Demo</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#1d1d1d;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
.container{
 max-width:450px;
 margin:auto;
 min-height:100vh;
 padding:35px 30px;
 display:flex;
 flex-direction:column;
 align-items:center;
}
.language{
 color:#bbb;
 font-size:17px;
 margin-top:70px;
}
.logo{
 margin-top:125px;
 width:100px;
 height:100px;
 border:9px solid transparent;
 border-radius:29px;
 background:
 linear-gradient(#1d1d1d,#1d1d1d) padding-box,
 linear-gradient(45deg,#ffb900,#ff0069,#a000ff) border-box;
 display:grid;
 place-items:center;
}
.camera{
 width:49px;
 height:49px;
 border:7px solid #ec168a;
 border-radius:50%;
 position:relative;
}
.camera:after{
 content:"";
 position:absolute;
 width:9px;
 height:9px;
 background:#ec168a;
 border-radius:50%;
 right:-13px;
 top:-13px;
}
form{
 width:100%;
 margin-top:140px;
}
input{
 width:100%;
 height:75px;
 background:transparent;
 border:2px solid #484848;
 border-radius:22px;
 padding:20px;
 color:white;
 font-size:16px;
 margin-bottom:20px;
}
button{
 width:100%;
 height:75px;
 background:#0866df;
 color:white;
 border:0;
 border-radius:40px;
 font-size:21px;
}
.message{
 color:#70baff;
 text-align:center;
 margin-top:20px;
}
.spacer{flex:1;min-height:100px}
.create{
 background:transparent;
 border:2px solid #3986d9;
 color:#65b4ff;
}
.footer{
 margin-top:30px;
 font-size:32px;
 font-weight:bold;
 letter-spacing:5px;
}
.disclaimer{
 color:#aaa;
 font-size:11px;
 margin-top:12px;
}
</style>
</head>

<body>
<div class="container">

<div class="language">English (US) ⌄</div>

<div class="logo">
<div class="camera"></div>
</div>

<form id="demo">
<input
type="text"
placeholder="Demo username"
required>

<button type="submit">Try Demo</button>
<div class="message" id="message"></div>
</form>

<div class="spacer"></div>

<button class="create" type="button"
onclick="document.getElementById('message').textContent='Welcome to 100K!'">
Create new account
</button>

<div class="footer">100K</div>
<div class="disclaimer">INDEPENDENT DESIGN MOCKUP</div>

</div>

<script>
document.getElementById("demo").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("message").textContent=
"Welcome to 100K Social!";
});
</script>
</body>
</html>

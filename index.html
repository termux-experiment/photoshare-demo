
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoShare Demo</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
 padding:20px;
}
.card{
 background:white;
 width:100%;
 max-width:360px;
 padding:30px 25px;
 border-radius:18px;
 text-align:center;
 box-shadow:0 12px 35px #0003;
}
.logo{
 font-size:38px;
 font-weight:bold;
 color:#833ab4;
 margin:10px;
}
.tag{
 color:#777;
 font-size:13px;
 margin-bottom:25px;
}
input{
 width:100%;
 padding:15px;
 margin:8px 0;
 border:1px solid #ddd;
 border-radius:8px;
 font-size:15px;
}
button{
 width:100%;
 padding:14px;
 margin-top:15px;
 border:0;
 border-radius:8px;
 color:white;
 font-size:16px;
 font-weight:bold;
 background:linear-gradient(90deg,#833ab4,#e1306c);
}
.note{
 margin-top:25px;
 color:#777;
 font-size:12px;
}
#result{
 color:green;
 font-weight:bold;
}
</style>
</head>
<body>
<div class="card">
<div class="logo">PhotoShare</div>
<div class="tag">SHARE YOUR MOMENTS</div>

<h3>Welcome Back!</h3>
<p>Try our demo experience</p>

<form id="demo">
<input id="username"
placeholder="Demo Username" required>

<button type="submit">Try Demo</button>
</form>

<p id="result"></p>

<div class="note">
DEMO WEBSITE • NOT INSTAGRAM
</div>
</div>

<script>
document.getElementById("demo")
.addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("result").textContent=
"Welcome to PhotoShare Demo!";
});
</script>
</body>
</html>
